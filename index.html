<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪙 3D硬币翻转与多人预测派对</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #11111d 100%);
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px rgba(255, 255, 255, 0.1) solid;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .game-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 3D Coin Style */
        .coin-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .coin {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s ease-out;
            cursor: pointer;
        }

        .coin div {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            border: 5px solid #ffd700;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(255,215,0,0.5);
        }

        .heads {
            background: radial-gradient(circle, #ffe066, #f5b041);
            color: #512e5f;
            transform: rotateY(0deg);
        }

        .tails {
            background: radial-gradient(circle, #bdc3c7, #7f8c8d);
            color: #2c3e50;
            border-color: #ecf0f1 !important;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(236,240,241,0.5) !important;
            transform: rotateY(180deg);
        }

        /* Rotation Animations */
        .flip-heads {
            animation: flipHeads 3s ease-out forwards;
        }

        .flip-tails {
            animation: flipTails 3s ease-out forwards;
        }

        @keyframes flipHeads {
            0% { transform: rotateY(0); }
            100% { transform: rotateY(1800deg); }
        }

        @keyframes flipTails {
            0% { transform: rotateY(0); }
            100% { transform: rotateY(1980deg); }
        }

        /* Player Section Styles */
        .players-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .add-player-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], select {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            color: white;
            border-radius: 8px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ffd700;
        }

        button {
            background: linear-gradient(135deg, #ffd700, #f39c12);
            border: none;
            padding: 10px 20px;
            color: #111;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.95);
        }

        .player-row {
            display: grid;
            grid-template-columns: 2fr 1.5fr 2fr 0.8fr;
            gap: 15px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .player-header {
            font-weight: bold;
            color: #aaa;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
        }

        .control-panel {
            text-align: center;
            margin-top: 30px;
        }

        .btn-large {
            font-size: 1.25em;
            padding: 15px 40px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .status-msg {
            font-size: 1.2em;
            margin-top: 15px;
            font-weight: bold;
            color: #ffd700;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🪙 硬币多人预测博弈局</h1>
            <p>添加玩家，预测正反，看看谁能猜中最多！</p>
        </header>

        <div class="game-layout">
            <!-- 左侧：硬币和控制台 -->
            <div class="coin-section">
                <div class="coin" id="coin">
                    <div class="heads">正面</div>
                    <div class="tails">反面</div>
                </div>
                <div class="control-panel">
                    <button class="btn-large" id="flip-btn" onclick="flipCoin()">开始抛硬币！</button>
                    <div class="status-msg" id="status"></div>
                </div>
            </div>

            <!-- 右侧：玩家列表面板 -->
            <div class="players-section">
                <h3>🎮 玩家控制面板</h3>
                <div class="add-player-box">
                    <input type="text" id="new-player-name" placeholder="输入新玩家名字...">
                    <button onclick="addPlayer()">添加玩家</button>
                </div>
                
                <div id="player-list-container">
                    <div class="player-row player-header">
                        <div>玩家</div>
                        <div>累计胜利</div>
                        <div>选择预测</div>
                        <div>操作</div>
                    </div>
                    <div id="players-list">
                        <!-- 动态添加玩家 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let players = [
            { id: 1, name: '小王', wins: 0 },
            { id: 2, name: '老张', wins: 0 }
        ];
        let flipping = false;

        function renderPlayers() {
            const listElement = document.getElementById('players-list');
            listElement.innerHTML = '';
            players.forEach(p => {
                listElement.innerHTML += `
                    <div class="player-row" id="p-row-${p.id}">
                        <div style="font-weight: bold; color: #ffd700;">${p.name}</div>
                        <div id="wins-${p.id}">🏆 ${p.wins} 次</div>
                        <div>
                            <select id="predict-${p.id}" style="width:100%">
                                <option value="Heads">正面 🪙</option>
                                <option value="Tails">反面 🥈</option>
                            </select>
                        </div>
                        <div>
                            <button class="btn-danger" onclick="removePlayer(${p.id})">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        function addPlayer() {
            const nameInput = document.getElementById('new-player-name');
            const name = nameInput.value.trim();
            if (name) {
                players.push({
                    id: Date.now(),
                    name: name,
                    wins: 0
                });
                nameInput.value = '';
                renderPlayers();
            }
        }

        function removePlayer(id) {
            players = players.filter(p => p.id !== id);
            renderPlayers();
        }

        function flipCoin() {
            if (flipping) return;
            if (players.length === 0) {
                alert("请先添加至少一位玩家！");
                return;
            }

            const coin = document.getElementById('coin');
            const status = document.getElementById('status');
            
            // 收集所有玩家当前选择的预测值
            let predictions = [];
            for (let p of players) {
                const prediction = document.getElementById(`predict-${p.id}`).value;
                predictions.push({ id: p.id, prediction: prediction });
            }

            flipping = true;
            status.innerText = "金币空中旋转中...";
            
            // 移除旧动画类
            coin.classList.remove('flip-heads', 'flip-tails');
            
            // 随机决定结果
            const isHeads = Math.random() < 0.5;
            const result = isHeads ? 'Heads' : 'Tails';
            
            // 强制回流以重启 CSS 动画
            void coin.offsetWidth; 
            
            // 应用动画
            coin.classList.add(isHeads ? 'flip-heads' : 'flip-tails');

            setTimeout(() => {
                flipping = false;
                let summary = isHeads ? "结果是：正面 🪙 ! \n\n" : "结果是：反面 🥈 ! \n\n";
                
                // 更新每位玩家的胜利次数
                players.forEach((p, idx) => {
                    const predObj = predictions[idx];
                    if (predObj.prediction === result) {
                        p.wins += 1;
                        summary += `✅ ${p.name} 猜对啦！累计胜利: ${p.wins} 次\n`;
                    } else {
                        summary += `❌ ${p.name} 猜错啦！\n`;
                    }
                });

                status.innerText = isHeads ? "🎉 正面！" : "🎉 反面！";
                alert(summary);
                renderPlayers();
            }, 3000);
        }

        // 初始化渲染
        renderPlayers();
    </script>
</body>
</html>
